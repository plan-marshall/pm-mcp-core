# The limits of the read of a build log (PM-ARCH-8, PM-IMPL-5).
# Each value is read when the class that names it is initialized. A resource that is absent, a key that is absent and
# a value that is not a non-negative integer are faults of the build and are never defaulted.
# tag::log-max-bytes[]
pm.core.build.log-max-bytes=16777216
# end::log-max-bytes[]
# tag::max-line-length[]
pm.core.build.max-line-length=8192
# end::max-line-length[]
