# The limits of the read of a coverage report (PM-ARCH-8, PM-IMPL-5).
# Each value is read when the class that names it is initialized. A resource that is absent, a key that is absent and
# a value that is not a non-negative integer are faults of the build and are never defaulted.
# tag::coverage-max-bytes[]
pm.core.build.coverage-max-bytes=268435456
# end::coverage-max-bytes[]
# tag::coverage-max-line-length[]
pm.core.build.coverage-max-line-length=8192
# end::coverage-max-line-length[]
