# The limits of a project unit file and of a unit frontmatter (PM-IMPL-5).
# Each value is read when the class that names it is initialized. A resource that is absent, a key that is absent and
# a value that is not a non-negative integer are faults of the build and are never defaulted.
# tag::max-unit-file-bytes[]
pm.workflow.unit.max-file-bytes=1048576
# end::max-unit-file-bytes[]
# tag::max-frontmatter-lines[]
pm.workflow.unit.max-frontmatter-lines=200
# end::max-frontmatter-lines[]
# tag::max-echo-length[]
pm.workflow.unit.max-echo-length=80
# end::max-echo-length[]
