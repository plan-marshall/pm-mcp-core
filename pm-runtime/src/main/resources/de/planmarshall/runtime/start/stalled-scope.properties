# The stalled threshold of the stalled-scope detection (PM-ARCH-8).
# The value is read when StalledScopeDetector is initialized. A resource that is absent, a key that is absent and a
# value that is not a non-negative integer are faults of the build and are never defaulted.
# tag::stalled-threshold[]
pm.runtime.stalled-threshold-seconds=600
# end::stalled-threshold[]
