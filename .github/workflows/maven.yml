# Example: Copy this to your repo as .github/workflows/maven.yml
# Configuration is read from .github/project.yml - no inputs needed!
name: Maven Build

on:
  # Required so the 'build / conclusion' status check runs on the merge-queue
  # branch; without it, queued PRs stay CLEAN but never merge (queue times out).
  merge_group:
  push:
    branches: [main, "release/*", "dependabot/**"]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read        # the conclusion job verifies a covering run exists

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-build.yml@3e1ecafb6a194fe22fc6a9bfdc2a41c81584f989 # v0.43.0
    # No publishing credentials: the modules go to the package registry of the organisation and nowhere else.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Deploys the SNAPSHOT to https://maven.pkg.github.com/plan-marshall/pm-mcp-core after a green build on
  # main (project.yml: enable-snapshot-deploy, deploy-target github-packages). The only credential is the
  # GITHUB_TOKEN of the run, which needs packages: write for it.
  deploy-snapshot:
    needs: build
    if: needs.build.outputs.github-packages-deploy == 'true'
    permissions:
      contents: read
      packages: write
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-github-packages-deploy.yml@3e1ecafb6a194fe22fc6a9bfdc2a41c81584f989 # v0.43.0
